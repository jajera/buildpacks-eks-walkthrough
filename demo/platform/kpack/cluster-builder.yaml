# Reference ClusterStore / ClusterStack / ClusterBuilder.
# Walkthrough renders ECR_URI into the builder tag before apply.
apiVersion: kpack.io/v1alpha2
kind: ClusterStore
metadata:
  name: default
spec:
  sources:
    - image: docker.io/paketobuildpacks/java
    - image: docker.io/paketobuildpacks/go
    - image: docker.io/paketobuildpacks/nodejs
    - image: docker.io/paketobuildpacks/python
    - image: docker.io/paketobuildpacks/procfile
    - image: docker.io/paketobuildpacks/environment-variables
---
apiVersion: kpack.io/v1alpha2
kind: ClusterStack
metadata:
  name: base
spec:
  id: "io.buildpacks.stacks.jammy"
  buildImage:
    image: paketobuildpacks/build-jammy-base
  runImage:
    image: paketobuildpacks/run-jammy-base
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuilder
metadata:
  name: default
spec:
  tag: ECR_URI:kpack-builder
  serviceAccountRef:
    name: kpack-sa
    namespace: default
  store:
    name: default
    kind: ClusterStore
  stack:
    name: base
    kind: ClusterStack
  order:
    - group:
        - id: paketo-buildpacks/go
    - group:
        - id: paketo-buildpacks/nodejs
    - group:
        - id: paketo-buildpacks/python
    - group:
        - id: paketo-buildpacks/java
